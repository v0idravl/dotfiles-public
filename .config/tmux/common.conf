# common.conf — tmux core, pulled in via `source-file` at the top of
# ~/.tmux.conf. Edit HERE for the shared behavior; keep only machine-specific
# pieces (prefix, copy-mode clipboard command, status-bar text/colors) in
# ~/.tmux.conf itself.

set -g mouse on
set -g base-index 1
set -g pane-base-index 1

# True color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

# OSC 52 clipboard — set the outer terminal's clipboard, and (when this is the
# outer tmux of a nested ssh session) relay an inner tmux's OSC 52 out to it
set -g set-clipboard on
set -ga terminal-features ",*:clipboard"

# Splits — stay in current dir, unbind defaults
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation (deliberate)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt+arrow pane navigation (no prefix — fast reactive switching)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Easy config reload
bind r source-file ~/.tmux.conf

# Synchronize panes (send keystrokes to all panes at once)
bind S setw synchronize-panes

set -g renumber-windows on          # close gap when window killed
set -sg escape-time 0               # faster key response (good for vim)
set -g history-limit 50000          # bigger scrollback buffer
setw -g mode-keys vi                # vi keys in copy mode

# Keyboard scrolling — copy mode without the mouse (the wheel still works;
# `mouse on` above keeps it entering copy mode). `prefix u` enters copy mode
# pre-scrolled one page up, mirroring what a wheel-flick used to start;
# `prefix [` (stock) enters at the bottom. Inside, on top of the vi defaults
# (v select, C-u/C-d half-page, C-b/C-f full page, q/Esc leave):
#   u/d  half-page up/down — home-row scrolling for boards that bury
#        PageUp/PageDn on a layer
#   g/G  jump to oldest / newest scrollback
bind u copy-mode -u
bind -T copy-mode-vi u send-keys -X halfpage-up
bind -T copy-mode-vi d send-keys -X halfpage-down
bind -T copy-mode-vi g send-keys -X history-top
bind -T copy-mode-vi G send-keys -X history-bottom
setw -g aggressive-resize on        # don't constrain to smallest attached client
set-option -g allow-rename off      # preserve window names set manually

# Status bar — geometry and formats identical across machines; position,
# left/right text, current-window color and active border live in the
# GENERATED theme.conf (theme-set: dragon/redlight).
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-format         "#[fg=#727169] #I:#W "
set -g window-status-separator      ""
set -g pane-border-style        "fg=#54546d"
