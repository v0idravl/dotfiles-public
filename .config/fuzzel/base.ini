# fuzzel launcher — non-color settings only. The [colors] section is
# GENERATED onto the end of ~/.config/fuzzel/fuzzel.ini by theme-set
# (dragon/redlight); fuzzel reads its config fresh on every launch.
# validated against fuzzel 1.12.0 (man fuzzel.ini)

[main]
font=Terminess Nerd Font:size=12
terminal=alacritty
lines=10
horizontal-pad=16
vertical-pad=10
inner-pad=8

[border]
width=2
radius=6
