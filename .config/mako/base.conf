# mako notifications — non-color settings only.
# Colors (incl. the [urgency=high] override) are GENERATED onto the end of
# ~/.config/mako/config by theme-set (dragon/redlight); `makoctl reload`
# applies them live. Edit colors in theme-set, layout here; run
# `theme-set --force` to regenerate after editing this file.
# validated against mako-notifier 1.10.0 (man 5 mako)

font=Terminess Nerd Font 11
border-size=2
border-radius=6
width=350
padding=10
margin=10
default-timeout=5000
