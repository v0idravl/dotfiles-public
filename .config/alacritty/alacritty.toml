# Colors live in theme.toml, GENERATED by theme-set (dragon/redlight) and
# watched by alacritty's live config reload — edit theme-set, not that file.
[general]
import = ["~/.config/alacritty/theme.toml"]

[window]
dimensions = { columns = 220, lines = 55 }
padding = { x = 8, y = 8 }
decorations = "none"
opacity = 0.95

# Terminess Nerd Font Mono (ryanoasis Terminus patch) — install from your
# package manager or nerdfonts.com. Why this font: digital/bitmap-derived
# terminal face with very crisp readability, and the ryanoasis patch draws
# nerd icon glyphs at full em size — fonts-cascadia-code NF faces
# (the previous pick) scale those same icons to 31-69% of the em box,
# which rendered them unreadably small. The MONO faces were tried here
# first (strict one-cell icons, zero crowding) but in practice the
# one-cell scaling squeezes nerd icons down to unreadably tiny ink,
# so the terminal uses the non-Mono faces like every GUI app does,
# and icons draw at full em size. Known
# tradeoff: an icon wider than one cell can overrun into the next
# cell and crowd the following character; accepted as the lesser evil.
# (waybar still runs the Mono faces by preference.)
[font]
normal  = { family = "Terminess Nerd Font", style = "Regular" }
bold    = { family = "Terminess Nerd Font", style = "Bold" }
italic  = { family = "Terminess Nerd Font", style = "Italic" }
size    = 14.0

[cursor]
style = { shape = "Block", blinking = "Off" }

[scrolling]
history = 10000

# Keyboard scrolling for the rare no-tmux shell — inside tmux, copy mode owns
# scrollback instead (prefix u / prefix [, see tmux common.conf), and these
# keys pass through to it. Ctrl+Shift+Space toggles alacritty's own vi mode
# (stock default) for full keyboard scrollback + selection here; the bindings
# below cover quick line/page scrolls without entering it. Picked off the
# home row because some keyboards keep PageUp/PageDn on a layer.
[keyboard]
bindings = [
  { key = "K", mods = "Control|Shift", action = "ScrollLineUp" },
  { key = "J", mods = "Control|Shift", action = "ScrollLineDown" },
  { key = "U", mods = "Control|Shift", action = "ScrollPageUp" },
  { key = "D", mods = "Control|Shift", action = "ScrollPageDown" },
  { key = "G", mods = "Control|Shift", action = "ScrollToBottom" },
]
