# .tmux.conf — the shared core lives in ~/.config/tmux/common.conf.
# Keep this file to the prefix, the wl-copy clipboard, and the status bar.
source-file ~/.config/tmux/common.conf

# Prefix — C-a on the host, so a nested tmux on a remote box over SSH (stock
# C-b) stays unambiguous: C-a hits the outer (host) session, C-b the inner one.
set -g prefix C-a
unbind C-b

# Pin the shell. tmux derives default-shell from $SHELL *at server birth*, so
# if the first-ever tmux command is a detached launcher running from a bash
# context (e.g. `tmux new-session -d ... python3 foo.py`), the whole server
# gets stuck on /bin/bash for every new window in every session.
set -g default-shell /bin/zsh

# Copy mode — yank to the Wayland clipboard (sway/alacritty are native Wayland).
# NOT xclip: the X and Wayland clipboards are not synced under sway, so an
# xclip yank lands in a clipboard no native app can paste from. If wl-copy is
# missing (e.g. SSH'd into this host), set-clipboard above still relays OSC 52.
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

# ── Status bar ─────────────────────────────────────────────────
set -g status-position bottom
# Colors + status formats live in ~/.config/tmux/theme.conf (GENERATED by
# theme-set: dragon/redlight). theme-set re-sources it in the running server
# on every switch, so the change is live; new servers read it here at startup.
source-file ~/.config/tmux/theme.conf
